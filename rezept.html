<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chicken Wings</title>
</head>
<body>
  <h1>Crispy Chicken Wings</h1>
  <img src="https://www.thecookierookie.com/wp-content/uploads/2024/02/bbq-chicken-wings-recipe-featured-image.jpg" alt="Plate of chicken wings" width="400">

  <h3>Einkaufsliste</h2>
  <table>
   <tr>
    <th>Zutaten</th>
    <th>Menge</th>
  </tr>
  <tr>
    <td>Chicken wings</td>
    <td>1000 g</td>
  </tr>
  <tr>
    <td>Salz</td>
    <td>8 g</td>
  </tr>
  </table>

  <h2>Zubereitung</h2>
  <p>Dieses Rezept ist für die Zubereitung im Backofen</p>
  <ol>
    <li>Den Ofen 5-10 minuten vorheizen bei 180 grad</li>
    <li>Die Chicken Wings auf ein Blech geben und leicht einfetten</li>
    <li>Für 25 min goldbraun backen lassen</li>
  </ol>
</body>
</html>
